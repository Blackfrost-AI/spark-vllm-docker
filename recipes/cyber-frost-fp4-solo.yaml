# Recipe: CYBER-FROST-FP4 (Blackfrost branded serve)
# Blackfrost-Research/CYBER-FROST-3.8 converted to the exact nvidia/Qwen3.8-
# Flash-Next-FP4-Local storage format. Served from a local model directory via
# the B12X stack with PLE tables offloaded to disk.
#
# Model is NOT downloaded from HuggingFace: it already exists locally at
# /home/blackfrost_ai/models/CYBER-FROST-3.8-FP4-Local and is bind-mounted
# into the container at /models/CYBER-FROST-3.8-FP4-Local (added via the
# runner's -v passthrough at launch, since recipes cannot declare volumes).
#
# Served model name: CYBER-FROST-FP4  (API-visible name)

recipe_version: "1"
name: CYBER-FROST-FP4 (Solo)
description: vLLM serving local CYBER-FROST-3.8-FP4-Local on one DGX Spark with PLE disk offload (branded serve)

# Model field intentionally empty: weights are LOCAL, not in the HF cache.
# Launch must pass:
#   -v /home/blackfrost_ai/models/CYBER-FROST-3.8-FP4-Local:/models/CYBER-FROST-3.8-FP4-Local
model: ""
container: vllm-node-b12x

solo_only: true

mods: []

defaults:
  port: 8899
  host: 0.0.0.0
  tensor_parallel: 1
  pipeline_parallel: 1
  block_size: 16
  max_model_len: 262144
  max_num_seqs: 8
  max_num_batched_tokens: 4096
  num_speculative_tokens: 4
  gpu_memory_utilization: 0.92

env:
  VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"
  VLLM_PLE_TABLE_MEMORY: "disk"
  B12X_DISK_BACKEND: "io_uring"
  CUTE_DSL_ARCH: "sm_121a"
  SAFETENSORS_FAST_GPU: "1"
  VLLM_WORKER_MULTIPROC_METHOD: "spawn"
  VLLM_SSM_CONV_STATE_LAYOUT: "DS"
  VLLM_USE_AOT_COMPILE: "1"
  VLLM_USE_MEGA_AOT_ARTIFACT: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  B12X_POLICY_MODE: "auto"
  VLLM_MXFP8_LM_HEAD: "1"
  VLLM_B12X_MOE_FP4_LAYER_MAX_INPUT_SCALE: "w13"
  VLLM_B12X_MOE_FP4_FORCE_A16: "1"
  B12X_W4A16_A4_PREFILL: "1"

command: |
  vllm serve /models/CYBER-FROST-3.8-FP4-Local --served-model-name CYBER-FROST-FP4 \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --pipeline-parallel-size {pipeline_parallel} \
    --mamba-cache-mode align \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --dtype bfloat16 \
    --kv-cache-dtype fp8 \
    --quantization modelopt_mixed \
    --block-size {block_size} \
    --load-format b12x \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --speculative-config '{{"method":"mtp","num_speculative_tokens":{num_speculative_tokens}}}' \
    --gdn-decode-kernel b12x \
    --linear-backend b12x \
    --moe-backend b12x \
    --no-enable-flashinfer-autotune \
    --mm-encoder-tp-mode data \
    --reasoning-parser qwen3 \
    --tool-call-parser qwen3_xml \
    --enable-auto-tool-choice \
    --compilation-config '{{"pass_config":{{"fuse_act_quant":true}}}}' \
    --gpu-memory-utilization {gpu_memory_utilization}
